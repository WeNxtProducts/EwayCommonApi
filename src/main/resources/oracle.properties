YI_ADDITIONAL_DETAILS =SELECT HPM.COMPANY_ID COMPANY_ID , HPM.BROKER_CODE RSA_BROKER_CODE, HPM.POLICY_TERM POLICY_TERM, HPM.LOGIN_ID LOGIN_ID, HPM.QUOTE_NO QUOTE_NO, HPM.ENDT_PREV_POLICY_NO PREV_POLICYNO FROM HOME_POSITION_MASTER HPM WHERE QUOTE_NO=?1 
 
 
MADISON_PT_MAIN_DETAILS =SELECT HPM.POLICY_NO, HPM.BRANCH_CODE, CPM.CORE_APP_CODE AS PRODUCT_CODE, HPM.BROKER_CODE, HPM.CUSTOMER_NAME, PIN.CUSTOMER_REFERENCE_NO AS CUSTOMER_CODE, PIN.EMAIL_1 AS EMAIL, ADDRESS_1 AS ADDRESS, CITY_NAME, PIN_CODE,(CASE WHEN PIN.POLICY_HOLDER_TYPEID ='3' THEN PIN.ID_NUMBER ELSE '' END) AS PASSPORT, PIN.MOBILE_NO_1 AS MOBILE_NO, (CASE WHEN PIN.POLICY_HOLDER_TYPEID ='1' THEN PIN.ID_NUMBER ELSE '' END) AS NRC, HPM.EFFECTIVE_DATE, HPM.EXPIRY_DATE, HPM.CURRENCY, ECM.CORE_APP_CODE AS CURRENCY_CODE, HPM.EXCHANGE_RATE, HPM.POLICY_TERM, (CASE WHEN PIN.POLICY_HOLDER_TYPEID ='7' THEN PIN.ID_NUMBER ELSE '' END) AS COMPANY_REG_NUMBER, HPM.LOGIN_ID, HPM.QUOTE_NO, PIN.POLICY_HOLDER_TYPE_DESC, PIN.OCCUPATION_DESC, PIN.CLIENT_NAME AS FIRST_NAME, (CASE WHEN HPM.CURRENCY IN (CPM.CURRENCY_IDS) THEN HPM.PREMIUM_LC ELSE HPM.PREMIUM_FC END) AS PREMIUM, PD.PAYMENT_ID, PD.UPDATED_DATE AS PAYMENT_DATE, PD.ACCOUNT_NUMBER FROM HOME_POSITION_MASTER HPM ,COMPANY_PRODUCT_MASTER CPM, PERSONAL_INFO PIN,EWAY_CURRENCY_MASTER ECM, PAYMENT_DETAIL PD WHERE HPM.QUOTE_NO=?1 AND PD.QUOTE_NO=HPM.QUOTE_NO AND PD.PAYMENT_STATUS='ACCEPTED' AND HPM.COMPANY_ID=CPM.COMPANY_ID AND HPM.PRODUCT_ID=CPM.PRODUCT_ID AND CPM.STATUS='Y' AND SYSDATE() BETWEEN CPM.EFFECTIVE_DATE_START AND CPM.EFFECTIVE_DATE_END AND CPM.AMEND_ID=(SELECT MAX(AMEND_ID) FROM COMPANY_PRODUCT_MASTER WHERE COMPANY_ID = HPM.COMPANY_ID AND PRODUCT_ID = HPM.PRODUCT_ID AND STATUS = 'Y' AND SYSDATE() BETWEEN EFFECTIVE_DATE_START AND EFFECTIVE_DATE_END) AND PIN.CUSTOMER_ID=HPM.CUSTOMER_ID AND ECM.STATUS='Y' AND ECM.CURRENCY_ID=HPM.CURRENCY AND SYSDATE() BETWEEN ECM.EFFECTIVE_DATE_START AND ECM.EFFECTIVE_DATE_END AND ECM.COMPANY_ID=HPM.COMPANY_ID AND ECM.AMEND_ID=(SELECT MAX(AMEND_ID) FROM EWAY_CURRENCY_MASTER WHERE STATUS='Y' AND CURRENCY_ID=HPM.CURRENCY AND ECM.COMPANY_ID=HPM.COMPANY_ID AND SYSDATE() BETWEEN EFFECTIVE_DATE_START AND EFFECTIVE_DATE_END)

MADISON_PT_RISK_DETAILS =SELECT MDD.VEHICLE_ID, MDD.VEHICLE_MAKE, MDD.VEHCILE_MODEL_DESC, MDD.VEHICLE_TYPE_DESC, MDD.CHASSIS_NUMBER, MDD.REGISTRATION_NUMBER, MDD.ENGINE_NUMBER, MDD.MANUFACTURE_YEAR, MDD.SEATING_CAPACITY, PIN.CUSTOMER_REFERENCE_NO AS CUSTOMER_CODE, PIN.DOB_OR_REG_DATE, COALESCE(MDD.COLLATERAL_YN,'') AS COLLATERAL_YN, COALESCE(MDD.COLLATERAL_NAME,'') AS COLLATERAL_NAME, MDD.ENDT_PREV_POLICY_NO AS PREV_POLICY_NO, COALESCE(MDD.ENDORSEMENT_DATE,'') AS ENDORSEMENT_DATE, MDD.COMPANY_ID, MDD.COLOR_DESC, MDD.POLICY_START_DATE, MDD.POLICY_END_DATE, EBM.CORE_APP_CODE AS BRANCH_CODE, HPM.BROKER_CODE, HPM.POLICY_TERM, CPM.CORE_APP_CODE AS PRODUCT_CODE, ECM.CORE_APP_CODE AS CURRENCY_CODE, HPM.LOGIN_ID, HPM.QUOTE_NO FROM MOTOR_DATA_DETAILS MDD, PERSONAL_INFO PIN, EWAY_BRANCH_MASTER EBM, HOME_POSITION_MASTER HPM, COMPANY_PRODUCT_MASTER CPM, EWAY_CURRENCY_MASTER ECM WHERE MDD.QUOTE_NO=?1 AND MDD.CUSTOMER_ID=PIN.CUSTOMER_ID AND EBM.BRANCH_CODE=HPM.BRANCH_CODE AND EBM.STATUS='Y' AND EBM.COMPANY_ID=HPM.COMPANY_ID AND EBM.AMEND_ID=(SELECT MAX(AMEND_ID) FROM EWAY_BRANCH_MASTER WHERE STATUS='Y' AND BRANCH_CODE=EBM.BRANCH_CODE AND SYSDATE() BETWEEN EFFECTIVE_DATE_START AND EFFECTIVE_DATE_END) AND MDD.POLICY_NO=HPM.POLICY_NO AND HPM.COMPANY_ID=CPM.COMPANY_ID AND HPM.PRODUCT_ID=CPM.PRODUCT_ID AND CPM.STATUS='Y' AND SYSDATE() BETWEEN CPM.EFFECTIVE_DATE_START AND CPM.EFFECTIVE_DATE_END AND CPM.AMEND_ID=(SELECT MAX(AMEND_ID) FROM COMPANY_PRODUCT_MASTER WHERE COMPANY_ID = HPM.COMPANY_ID AND PRODUCT_ID = HPM.PRODUCT_ID AND STATUS = 'Y' AND SYSDATE() BETWEEN EFFECTIVE_DATE_START AND EFFECTIVE_DATE_END) AND ECM.STATUS='Y' AND ECM.CURRENCY_ID=HPM.CURRENCY AND SYSDATE() BETWEEN ECM.EFFECTIVE_DATE_START AND ECM.EFFECTIVE_DATE_END AND ECM.COMPANY_ID=HPM.COMPANY_ID AND ECM.AMEND_ID=(SELECT MAX(AMEND_ID) FROM EWAY_CURRENCY_MASTER WHERE STATUS='Y' AND CURRENCY_ID=HPM.CURRENCY AND ECM.COMPANY_ID=HPM.COMPANY_ID AND SYSDATE() BETWEEN EFFECTIVE_DATE_START AND EFFECTIVE_DATE_END)

MADISON_PT_COVER_DETAILS =SELECT HPM.POLICY_NO, PCD.VEHICLE_ID, PCD.COVER_ID, PCD.COVER_NAME, PCD.COVERAGE_TYPE, PCD.SUM_INSURED, PCD.RATE, EBM.CORE_APP_CODE AS BRANCH_CODE, PCD.PREMIUM_EXCLUDED_TAX_LC, ECM.CORE_APP_CODE AS CURRENCY_CODE, CPM.CORE_APP_CODE AS PRODUCT_CODE, HPM.LOGIN_ID, HPM.QUOTE_NO FROM POLICY_COVER_DATA PCD, EWAY_CURRENCY_MASTER ECM, HOME_POSITION_MASTER HPM, COMPANY_PRODUCT_MASTER CPM, EWAY_BRANCH_MASTER EBM WHERE HPM.QUOTE_NO=?1 AND HPM.QUOTE_NO=PCD.QUOTE_NO AND ECM.STATUS='Y' AND ECM.CURRENCY_ID=HPM.CURRENCY AND SYSDATE() BETWEEN ECM.EFFECTIVE_DATE_START AND ECM.EFFECTIVE_DATE_END AND ECM.COMPANY_ID=HPM.COMPANY_ID AND ECM.AMEND_ID=(SELECT MAX(AMEND_ID) FROM EWAY_CURRENCY_MASTER WHERE STATUS='Y' AND CURRENCY_ID=HPM.CURRENCY AND ECM.COMPANY_ID=HPM.COMPANY_ID AND SYSDATE() BETWEEN EFFECTIVE_DATE_START AND EFFECTIVE_DATE_END) AND PCD.COVERAGE_TYPE IN('O','B') AND EBM.BRANCH_CODE=HPM.BRANCH_CODE AND EBM.STATUS='Y' AND EBM.COMPANY_ID=HPM.COMPANY_ID AND EBM.AMEND_ID=(SELECT MAX(AMEND_ID) FROM EWAY_BRANCH_MASTER WHERE STATUS='Y' AND BRANCH_CODE=EBM.BRANCH_CODE AND SYSDATE() BETWEEN EFFECTIVE_DATE_START AND EFFECTIVE_DATE_END) AND HPM.COMPANY_ID=CPM.COMPANY_ID AND HPM.PRODUCT_ID=CPM.PRODUCT_ID AND CPM.STATUS='Y' AND SYSDATE() BETWEEN CPM.EFFECTIVE_DATE_START AND CPM.EFFECTIVE_DATE_END AND CPM.AMEND_ID=(SELECT MAX(AMEND_ID) FROM COMPANY_PRODUCT_MASTER WHERE COMPANY_ID = HPM.COMPANY_ID AND PRODUCT_ID = HPM.PRODUCT_ID AND STATUS = 'Y' AND SYSDATE() BETWEEN EFFECTIVE_DATE_START AND EFFECTIVE_DATE_END)  

 MADISON_PT_TERMS_DETAILS =SELECT GROUP_CONCAT(TERMS) AS TERMS FROM( SELECT CLAUSES_DESCRIPTION AS terms FROM CLAUSES_MASTER CM INNER JOIN home_position_master HPM ON CM.COMPANY_ID = HPM.COMPANY_ID AND CM.PRODUCT_ID = HPM.PRODUCT_ID WHERE HPM.QUOTE_NO=?1 AND( CM.BRANCH_CODE = HPM.BRANCH_CODE OR CM.BRANCH_CODE = '99999') AND CM.STATUS = 'Y' AND (SELECT CURRENT_DATE FROM DUAL) BETWEEN CM.EFFECTIVE_DATE_START AND CM.EFFECTIVE_DATE_END AND HPM.QUOTE_NO NOT IN ( SELECT QUOTE_NO FROM terms_and_condition WHERE ID='6' ) UNION SELECT SUB_ID_DESC AS terms FROM terms_and_condition CM INNER JOIN home_position_master HPM ON CM.COMPANY_ID = HPM.COMPANY_ID AND CM.PRODUCT_ID = HPM.PRODUCT_ID WHERE HPM.QUOTE_NO=?1 AND HPM.QUOTE_NO IN (CM.QUOTE_NO) AND CM.STATUS = 'Y' AND ( CM.BRANCH_CODE = HPM.BRANCH_CODE OR CM.BRANCH_CODE = '99999' ) AND ID='6' UNION ALL SELECT EXCLUSION_DESCRIPTION AS terms FROM EXCLUSION_MASTER CM INNER JOIN home_position_master HPM ON CM.COMPANY_ID = HPM.COMPANY_ID AND CM.PRODUCT_ID = HPM.PRODUCT_ID WHERE HPM.QUOTE_NO=?1 AND ( CM.BRANCH_CODE = HPM.BRANCH_CODE OR CM.BRANCH_CODE = '99999' ) AND CM.STATUS = 'Y' AND (SELECT CURRENT_DATE FROM DUAL) BETWEEN CM.EFFECTIVE_DATE_START AND CM.EFFECTIVE_DATE_END AND HPM.QUOTE_NO NOT IN ( SELECT QUOTE_NO FROM terms_and_condition WHERE ID='7' ) UNION SELECT SUB_ID_DESC AS terms FROM terms_and_condition CM INNER JOIN home_position_master HPM ON CM.COMPANY_ID = HPM.COMPANY_ID AND CM.PRODUCT_ID = HPM.PRODUCT_ID WHERE HPM.QUOTE_NO=?1 AND HPM.QUOTE_NO IN (CM.QUOTE_NO) AND CM.STATUS = 'Y' AND ( CM.BRANCH_CODE = HPM.BRANCH_CODE OR CM.BRANCH_CODE = '99999' ) AND ID='7' UNION ALL SELECT WARRANTY_DESCRIPTION AS terms FROM WARRANTY_MASTER CM INNER JOIN home_position_master HPM ON CM.COMPANY_ID = HPM.COMPANY_ID AND CM.PRODUCT_ID = HPM.PRODUCT_ID WHERE HPM.QUOTE_NO=?1 AND ( CM.BRANCH_CODE = HPM.BRANCH_CODE OR CM.BRANCH_CODE = '99999' ) AND CM.STATUS = 'Y' AND (SELECT CURRENT_DATE FROM DUAL) BETWEEN CM.EFFECTIVE_DATE_START AND CM.EFFECTIVE_DATE_END AND HPM.QUOTE_NO NOT IN ( SELECT QUOTE_NO FROM terms_and_condition WHERE ID='4' ) UNION SELECT SUB_ID_DESC AS terms FROM terms_and_condition CM INNER JOIN home_position_master HPM ON CM.COMPANY_ID = HPM.COMPANY_ID AND CM.PRODUCT_ID = HPM.PRODUCT_ID WHERE HPM.QUOTE_NO=?1 AND HPM.QUOTE_NO IN (CM.QUOTE_NO) AND CM.STATUS = 'Y' AND ( CM.BRANCH_CODE = HPM.BRANCH_CODE OR CM.BRANCH_CODE = '99999' ) AND ID='4')X